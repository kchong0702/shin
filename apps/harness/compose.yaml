services:
  postgres:
    image: docker.io/library/postgres:17.6-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: zumi
      POSTGRES_DB: zumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:2026.11.14-a7128d5d1
    ports:
      - "127.0.0.1:8310:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  postgres:
