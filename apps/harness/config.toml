reasoning_effort = "low"
recursion_limit = 100

[app]
name = "harness"
version = "0.1.0"
route_prefix = "/zumi"
host = "127.0.0.1"
port = 8300
log_level = "info"

[browser]
transport = "stdio"
command = "npx"
args = ["-y", "@playwright/mcp@0.0.85", "--headless", "--isolated", "--snapshot-mode", "none"]

[search]
tavily_url = "https://api.tavily.com"
exa_url = "https://api.exa.ai"
searxng_url = "http://127.0.0.1:8310"
max_results = 5
max_content_chars = 4000
timeout_s = 20

[models]
glm = ["glm-5.3"]
claude = ["claude-opus-5-5", "claude-sonnet-5-5"]
openai = ["gpt-6-luna"]

[[agents]]
name = "sothoth"
path = "src/agents/sothoth/profile.yaml"
family = "openai"
model = "gpt-6-luna"
