[project]
name = "harness"
version = "0.1.0"
description = "Agent harness for Amaya and its specialist agents"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.3.0",
    "deepagents>=0.7.38",
    "dependency-injector>=4.49.1",
    "fastapi>=0.142.2",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "pydantic-settings>=2.15.0",
    "qwen-intelligence-sdk==0.3.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
qwen-intelligence-sdk = [
    { url = "https://github.com/Tongyi-MAI/OpenGCUA/releases/download/v0.3.1/qwen_intelligence_sdk-0.3.1-cp313-cp313-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { url = "https://github.com/Tongyi-MAI/OpenGCUA/releases/download/v0.3.1/qwen_intelligence_sdk-0.3.1-cp313-cp313-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"src/app/a2a/executable.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["a2a"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
reportImplicitOverride = "error"
